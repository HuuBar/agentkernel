[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkernel"
version = "0.1.0"
description = "Budget-Aware Call Graph (BACG) — Topology-aware resource allocation for AI Agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "HuuBar", email = "agentkernel@example.com"}]
keywords = ["agent", "llm", "resource-management", "call-graph", "budget-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
benchmark = ["openai>=1.0", "litellm>=1.0", "httpx>=0.24", "aiohttp>=3.8"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/HuuBar/agentkernel"
Documentation = "https://huubar.github.io/agentkernel"
